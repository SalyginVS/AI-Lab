[Unit]
Requires=ailab-gpu-power.service
After=ailab-gpu-power.service systemd-tmpfiles-setup.service
RequiresMountsFor=/srv/mbip05-models /srv/ai-test/mbip-strata-models /var/lib/mbip-strata
ConditionPathExists=
ConditionPathExists=/run/mbip05/active.json

[Service]
ExecStartPre=/bin/sh -c 'test "$( /usr/bin/nvidia-smi --query-gpu=power.limit --format=csv,noheader,nounits | cut -d. -f1 )" = 300'

[Install]
WantedBy=multi-user.target
