[Unit]
ConditionPathExists=/run/mbip05/active.json

[Service]
Environment=STRATA_INSTALL_DIR=/etc/mbip05/profiles
ExecStart=
ExecStart=/opt/mbip-strata/0.2.22/control/bin/strata serve --profile /run/mbip05/active.json --host 127.0.0.1 --port 18081 --parallel 1 --offline
ReadOnlyPaths=/srv/mbip05-models /etc/mbip05/profiles /run/mbip05
